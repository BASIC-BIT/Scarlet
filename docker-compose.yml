services:
  scarlet:
    build: .
    image: scarlet:headless
    container_name: scarlet
    environment:
      - SCARLET_HOME=/data
    volumes:
      - scarlet-data:/data
      # 0.4.16 moved the Discord token out of discord_bot.json and into an
      # encrypted registry backed by java.util.prefs, which lands in
      # ~/.java/.userPrefs. That is the container's writable layer, not a volume,
      # so `compose up -d` destroys it on every recreate.
      #
      # Worse, the migration is one-way: load() reads the token from the legacy
      # JSON and the save path that used to write it back is commented out, so
      # the first run consumes the token, erases it from the JSON, and stores it
      # somewhere that does not survive. The next recreate then prompts for a
      # token on a stdin that does not exist, and exits non-zero forever.
      #
      # Persisting this directory is what makes the token survive.
      - scarlet-prefs:/root/.java
      # These four are bind-mounted as individual FILES. They must already exist
      # on the host before `up`, or Docker silently creates directories in their
      # place and the app fails on startup. They are also the only copy of the
      # bot's token, permission map and state: back up ./configs/ separately.
      - ./configs/settings.json:/data/settings.json
      - ./configs/discord_bot.json:/data/discord_bot.json
      - ./configs/discord_perms.json:/data/discord_perms.json
      - ./configs/store.bin:/data/store.bin
    # Bounded on purpose. `unless-stopped` is what turned a startup crash into
    # 10559 restarts and roughly 10559 Discord logins, which is what got the bot
    # token reset. The crash was the bug; this policy was the amplifier, and it
    # would amplify the next unrelated crash exactly as well.
    #
    # Five attempts still absorbs a transient failure. What it will not do is
    # hammer a third-party API for a week unattended. A service that is still
    # down after five tries needs a human, not another retry.
    # The other half of that policy is the alarm that tells the human: installed on
    # the host as /usr/local/sbin/scarlet-alarm from scripts/scarlet-alarm.sh.
    restart: on-failure:5
    # Hard ceiling on the container. This host is shared with other services, so
    # an unbounded JVM here is their outage too: the old flags let the heap alone
    # reach ~1960 MB on a 3.9 GB box. Keep this above the Dockerfile's -Xmx,
    # since non-heap JVM memory lives outside it, and move both together.
    mem_limit: 1536m
    # Without this, a crash loop writes an unbounded json-file log until the disk
    # fills, which turns a bot outage into a host outage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No ports exposed; the app is client-style

volumes:
  scarlet-data:
  scarlet-prefs:
